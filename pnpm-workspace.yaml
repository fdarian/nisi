packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@google/genai': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
enableGlobalVirtualStore: true
packageExtensions:
  bun-types:
    dependencies:
      undici-types: "*"
  next-themes:
    dependencies:
      "@types/react": "*"
  drizzle-kit:
    peerDependencies:
      drizzle-orm: "*"
patchedDependencies:
