packages:
  - "packages/*"
  - "apps/*"
catalog:
  effect: 4.0.0-rc.112
  "@effect/platform-bun": 4.0.0-rc.112
  "@effect/sql-sqlite-bun": 4.0.0-rc.112
allowBuilds:
  '@google/genai': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  # Hash-pinned: pnpm resolves GitHub specs to codeload tarballs, which have no
  # stable allowBuilds key — bump this alongside any agentation update.
  agentation@https://codeload.github.com/fdarian/agentation/tar.gz/f19e8ff926c45ecd459cbaa5e0a8f4660128c154#path:package: true
enableGlobalVirtualStore: true
minimumReleaseAgeExclude:
  - '@pierre/diffs@1.3.5 || 1.4.1'
  - '@tanstack/router-core@1.171.19'
  - '@tanstack/router-generator@1.167.25'
  - '@ai-sdk/gateway@4.0.67'
  - '@ai-sdk/harness@1.0.91'
  - '@ai-sdk/provider-utils@5.0.32'
  - ai@7.0.83
  - '@ai-sdk/harness-claude-code@1.0.94'
  - '@ai-sdk/harness-codex@1.0.93'
  - '@ai-sdk/harness-opencode@1.0.92'
  - '@ai-sdk/harness-pi@1.0.93'
  - '@ai-sdk/mcp@2.0.39'
  - '@ai-sdk/react@4.0.86'
  - devsess@0.3.0
packageExtensions:
  bun-types:
    dependencies:
      undici-types: "*"
  next-themes:
    dependencies:
      "@types/react": "*"
  drizzle-kit:
    peerDependencies:
      drizzle-orm: "*"
  # @pierre/theming declares @shikijs/themes as an *optional* peer dep, but never
  # depends on it directly. pnpm only fills optional peers from deps declared by
  # direct ancestors, and @shikijs/themes lives only nested inside shiki's own
  # subtree (not as a direct dep of @pierre/diffs or @pierre/theming), so the slot
  # goes unfilled and @pierre/theming's runtime `import("@shikijs/themes/<name>")`
  # throws "Could not resolve" at runtime, breaking CodeView's highlight pipeline.
  # Must be optionalDependencies, not dependencies: with auto-install-peers on,
  # pnpm's resolver strips any injected `dependencies` key that also appears in
  # `peerDependencies` (it's treated as satisfying the peer, not adding a dep),
  # so a plain `dependencies` entry here silently no-ops. optionalDependencies
  # isn't subject to that strip and links directly into @pierre/theming's own
  # scope regardless of graph visibility.
  "@pierre/theming":
    optionalDependencies:
      "@shikijs/themes": "4.4.3"
patchedDependencies:
  "@ai-sdk/harness@1.0.91": patches/@ai-sdk%2Fharness@1.0.91.patch
  "@ai-sdk/harness-claude-code@1.0.94": patches/@ai-sdk%2Fharness-claude-code@1.0.94.patch
  "@ai-sdk/harness-codex@1.0.93": patches/@ai-sdk%2Fharness-codex@1.0.93.patch
  "@ai-sdk/harness-opencode@1.0.92": patches/@ai-sdk%2Fharness-opencode@1.0.92.patch
  "@pierre/diffs@1.4.1": patches/@pierre%2Fdiffs@1.4.1.patch
