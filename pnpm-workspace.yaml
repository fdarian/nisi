packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@google/genai': true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  # Hash-pinned: pnpm resolves GitHub specs to codeload tarballs, which have no
  # stable allowBuilds key — bump this alongside any agentation update.
  agentation@https://codeload.github.com/fdarian/agentation/tar.gz/ad60acffd03c394fc098796c85337d2cc6384783#path:package: true
enableGlobalVirtualStore: true
minimumReleaseAgeExclude:
  - '@pierre/diffs@1.3.5'
packageExtensions:
  bun-types:
    dependencies:
      undici-types: "*"
  next-themes:
    dependencies:
      "@types/react": "*"
  drizzle-kit:
    peerDependencies:
      drizzle-orm: "*"
patchedDependencies:
  "@ai-sdk/harness@1.0.54": patches/@ai-sdk%2Fharness@1.0.54.patch
  "@ai-sdk/harness-claude-code@1.0.55": patches/@ai-sdk%2Fharness-claude-code@1.0.55.patch
  "@ai-sdk/harness-codex@1.0.56": patches/@ai-sdk%2Fharness-codex@1.0.56.patch
  "@ai-sdk/harness-opencode@1.0.55": patches/@ai-sdk%2Fharness-opencode@1.0.55.patch
  "@ai-sdk/harness-pi@1.0.54": patches/@ai-sdk%2Fharness-pi@1.0.54.patch
