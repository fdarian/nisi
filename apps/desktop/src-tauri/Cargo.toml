[package]
name = "nisi"
version = "0.2.2"
description = "A Tauri App"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nisi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "time", "sync"] }
# Health-checks a sidecar.json's recorded port over plain HTTP (loopback
# only, never TLS) before trusting it — `default-features = false` drops the
# TLS backend (native-tls/rustls) neither this nor any http:// call needs.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
percent-encoding = "2.3.2"

[dev-dependencies]
# Test-only runtime bits for `#[tokio::test]` — kept out of the production
# feature set above so the shipped binary doesn't carry a full multi-thread
# scheduler it never needs (Tauri drives its own async runtime).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
