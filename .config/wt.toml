[[post-start]]
# -c = clonefile(2): instant CoW copy that preserves mtimes. Both matter — a plain `cp -R` of the
# 12G target takes minutes and stamps every file with its own copy time, which scrambles the mtime
# ordering cargo's freshness check relies on and forces a near-full rebuild.
copy_tauri_target = '''cp -Rc {{ repo_path }}/apps/desktop/src-tauri/target ./apps/desktop/src-tauri/target'''

# Same clonefile copy of devsess's session tree (.data/sessions/<slug>/data/...), dropping copied
# sidecar handshakes and Chromium singleton symlinks so the new worktree can own its own processes.
copy_desktop_data = '''cp -Rc {{ repo_path }}/apps/desktop/.data ./apps/desktop/.data && fd sidecar.json ./apps/desktop/.data -x rm && fd -t l '^Singleton(Lock|Socket|Cookie)$' ./apps/desktop/.data -x rm'''
