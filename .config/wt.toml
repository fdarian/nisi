[[post-start]]
# Same clonefile copy of devsess's session tree (.data/sessions/<slug>/data/...), dropping copied
# sidecar handshakes and Chromium singleton symlinks so the new worktree can own its own processes.
copy_desktop_data = '''cp -Rc {{ repo_path }}/apps/desktop/.data ./apps/desktop/.data && fd sidecar.json ./apps/desktop/.data -x rm && fd -t l '^Singleton(Lock|Socket|Cookie)$' ./apps/desktop/.data -x rm'''
