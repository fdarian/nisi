name: Setup
description: Set up pnpm, Node, and Bun, then install dependencies

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: pnpm
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
